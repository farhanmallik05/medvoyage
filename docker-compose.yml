version: '3.8'

services:
  medvoyage-marketplace:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MEDVOYAGE_DB_PATH=/data/medvoyage.db
    volumes:
      - medvoyage-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  medvoyage-data:
